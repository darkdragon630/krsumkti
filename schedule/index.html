<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah - UMK Teknik Informatika</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F3F3EF;
            --surface: #FFFFFF;
            --ink: #0A0A0A;
            --ink-soft: #6B6B64;
            --ink-faint: #9A9A93;
            --line: #D6D6D0;
            --line-strong: #0A0A0A;
            --red: #D4300C;
            --red-tint: #FBE9E4;
            --green: #2B7A4B;
            --green-tint: #E6F2EC;
            --blue: #1A56DB;
            --blue-tint: #EBF2FE;
            --purple: #6B21A8;
            --purple-tint: #F3E8FF;
            --taken: #A6A69F;
            --taken-tint: #ECECE8;
            --orange: #D48C0C;
            --orange-tint: #FEF3E4;
            --sans: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
            --grid-gap: 24px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--sans); }
        body { background: var(--bg); color: var(--ink); padding: 48px 32px 96px; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        .container { max-width: 1320px; margin: 0 auto; }
        .kicker { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
        h1 { text-align: left; color: var(--ink); font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase; border-bottom: 4px solid var(--ink); padding-bottom: 20px; margin-bottom: 32px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        h1::after { content: "JADWAL KULIAH"; font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.05em; color: var(--red); text-transform: none; white-space: nowrap; }

        .supabase-status { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 12px; padding: 6px 14px; border: 1px solid var(--line); background: var(--bg); margin-bottom: 20px; }
        .supabase-status .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .supabase-status .dot.connected { background: var(--green); }
        .supabase-status .dot.disconnected { background: var(--red); }
        .supabase-status .dot.loading { background: var(--orange); animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        #jadwal-mingguan { background: var(--surface); padding: 32px; border: 1px solid var(--ink); border-radius: 0; margin-top: 24px; font-family: var(--sans); display: block; }
        #jadwal-mingguan .judul { text-align: left; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; text-transform: uppercase; color: var(--ink); margin-bottom: 4px; }
        #jadwal-mingguan .sub-judul { text-align: left; font-size: 12px; font-family: var(--mono); color: var(--ink-soft); margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
        #jadwal-mingguan table { width: 100%; border-collapse: collapse; font-size: 13px; }
        #jadwal-mingguan th { background: var(--ink); color: var(--surface); padding: 10px 8px; text-align: left; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--mono); font-size: 11px; font-weight: 600; border: 1px solid var(--ink); }
        #jadwal-mingguan td { padding: 10px 8px; border: 1px solid var(--line); vertical-align: top; min-height: 60px; }
        #jadwal-mingguan .hari-label { font-weight: 700; text-align: left; background: var(--bg); width: 90px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; }
        #jadwal-mingguan .mk-item { font-size: 12px; line-height: 1.5; margin: 4px 0; padding: 6px 10px; border-radius: 0; background: var(--bg); border-left: 3px solid var(--ink); }
        #jadwal-mingguan .mk-item .kode { font-weight: 700; font-family: var(--mono); color: var(--ink); }
        #jadwal-mingguan .mk-item .nama-mk { font-weight: 500; color: var(--ink); }
        #jadwal-mingguan .mk-item .ruang { color: var(--ink-soft); font-size: 11px; font-family: var(--mono); }
        #jadwal-mingguan .mk-item .dosen-mk { color: var(--ink-faint); font-size: 11px; font-style: normal; font-family: var(--mono); }
        #jadwal-mingguan .mk-item .kategori-mk { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 1px 8px; border-radius: 0; margin-left: 6px; }
        #jadwal-mingguan .mk-item .kategori-mk.wajib { background: var(--red-tint); color: var(--red); }
        #jadwal-mingguan .mk-item .kategori-mk.pilihan { background: var(--green-tint); color: var(--green); }
        #jadwal-mingguan .mk-item.no-schedule-item { background: var(--orange-tint); border-left-color: var(--orange); opacity: 0.7; }
        #jadwal-mingguan .mk-item.no-schedule-item .kode { color: var(--orange); }
        #jadwal-mingguan .mk-item.taken-item { background: var(--taken-tint); border-left-color: var(--taken); }
        #jadwal-mingguan .mk-item.taken-item .kode { color: var(--taken); }
        #jadwal-mingguan .footer { margin-top: 16px; display: flex; justify-content: space-between; font-size: 12px; font-family: var(--mono); color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 12px; flex-wrap: wrap; gap: 8px; }

        .toast { position: fixed; bottom: 24px; right: 24px; background: var(--ink); color: var(--surface); padding: 14px 22px; border-radius: 0; border-left: 4px solid var(--red); box-shadow: none; display: none; z-index: 999; font-family: var(--mono); font-size: 13px; animation: slideUp 0.2s ease; }
        @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10,10,10,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .loading-overlay .spinner { background: var(--surface); padding: 32px 44px; border-radius: 0; text-align: center; }
        .loading-overlay .spinner .spin { display: inline-block; width: 32px; height: 32px; border: 3px solid var(--line); border-top: 3px solid var(--red); border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-overlay .spinner p { margin-top: 12px; color: var(--ink); font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
<div class="container">
    <div class="kicker">UMK — Teknik Informatika</div>
    <h1>Jadwal Kuliah</h1>

    <div class="supabase-status" id="supabaseStatus">
        <span class="dot loading" id="statusDot"></span>
        <span id="statusText">Memeriksa koneksi...</span>
        <span id="dbInfo" style="margin-left:auto;font-size:11px;color:var(--ink-faint);"></span>
    </div>

    <div id="jadwal-mingguan">
        <div class="judul">Jadwal Kuliah</div>
        <div class="sub-judul" id="jadwal-subjudul">Memuat jadwal...</div>
        <table>
            <thead><tr><th style="width:80px;">HARI</th><th>JADWAL KULIAH</th></tr></thead>
            <tbody id="jadwal-body">
                <tr><td class="hari-label">SENIN</td><td id="senin"></td></tr>
                <tr><td class="hari-label">SELASA</td><td id="selasa"></td></tr>
                <tr><td class="hari-label">RABU</td><td id="rabu"></td></tr>
                <tr><td class="hari-label">KAMIS</td><td id="kamis"></td></tr>
                <tr><td class="hari-label">JUMAT</td><td id="jumat"></td></tr>
                <tr><td class="hari-label">SABTU</td><td id="sabtu"></td></tr>
                <tr><td class="hari-label">MINGGU</td><td id="minggu"></td></tr>
            </tbody>
        </table>
        <div class="footer">
            <span>Total SKS: <span id="footer-sks">0</span></span>
            <span id="footer-info"></span>
        </div>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"><div class="spin"></div><p>Sedang memproses...</p></div>
</div>
<div class="toast" id="toast"></div>

<script>
    // ============================================
    // SUPABASE CONFIG
    // ============================================
    const SUPABASE_URL = 'https://wfxudgybbrsibzfyegcl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmeHVkZ3liYnJzaWJ6ZnllZ2NsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTQ3ODYsImV4cCI6MjEwMDc5MDc4Nn0.zZoM5I0GMJsD0huuWLR-ygCFxbSW2oWa5cqNEtrxvVA';

    let supabaseClient = null;
    let supabaseConnected = false;

    try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        supabaseConnected = true;
        document.getElementById('statusDot').className = 'dot connected';
        document.getElementById('statusText').textContent = '✅ Terhubung ke Supabase';
        document.getElementById('dbInfo').textContent = '📊 wfxudgybbrsibzfyegcl';
    } catch (e) {
        supabaseConnected = false;
        document.getElementById('statusDot').className = 'dot disconnected';
        document.getElementById('statusText').textContent = '❌ Gagal koneksi Supabase';
        console.warn('Supabase not available:', e.message);
    }

    // ============================================
    // STATE (Hanya untuk menampung data jadwal)
    // ============================================
    const ALL_SEMESTERS = [1,3,5,7,8];
    let data = {1:[],3:[],5:[],7:[],8:[]};

    // ============================================
    // LOAD FROM SHARE ID
    // ============================================
    async function loadFromShareId(shareId) {
        if (!supabaseConnected) { showToast('❌ Supabase tidak terhubung, tidak bisa memuat jadwal.'); return; }
        try {
            showToast('📋 Memuat jadwal...');
            document.getElementById('loadingOverlay').style.display = 'flex';
            const { data: row, error: err } = await supabaseClient
                .from('krs_shared')
                .select('*')
                .eq('share_id', shareId)
                .maybeSingle();
            document.getElementById('loadingOverlay').style.display = 'none';
            if (err) throw err;
            if (!row) { showToast('⚠️ Jadwal tidak ditemukan.'); return; }
            if (row.expires_at && new Date(row.expires_at) < new Date()) { showToast('⚠️ Link jadwal ini sudah kedaluwarsa.'); return; }

            applySharedPayload(row.data || []);
            updateJadwalMingguan();
            showToast('✅ Jadwal berhasil dimuat!');
        } catch (err) {
            document.getElementById('loadingOverlay').style.display = 'none';
            console.error(err);
            showToast('❌ Gagal memuat jadwal: ' + err.message);
        }
    }

    function applySharedPayload(items) {
        data = {1:[],3:[],5:[],7:[],8:[]};
        const semMap = {};
        (items || []).forEach(item => {
            const sem = item.sem || 5;
            if (!semMap[sem]) semMap[sem] = [];
            semMap[sem].push({
                no: item.no || '',
                kode: item.k,
                kelas: item.kl,
                nama: item.n,
                hari: item.h,
                jam: item.j,
                ruang: item.r,
                dosen: item.ds || '',
                sks: item.s || '0',
                sks_detail: item.sk || '',
                kategori: item.kat || 'Wajib',
            });
        });
        for (let sem of ALL_SEMESTERS) {
            if (semMap[sem]) { data[sem] = semMap[sem]; }
        }
    }

    // ============================================
    // RENDER JADWAL MINGGUAN (Read Only)
    // ============================================
    function parseTime(t){ const m=t.match(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/); return m?{start:parseInt(m[1])*100+parseInt(m[2]), end:parseInt(m[3])*100+parseInt(m[4])}:null; }

    function updateJadwalMingguan(){
        const selectedItems = [];
        for(let sem of ALL_SEMESTERS){
            const semData = data[sem] || [];
            semData.forEach(item => {
                if(item.hari !== 'Tidak tersedia') {
                    selectedItems.push(item);
                }
            });
        }

        const days = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
        const dayMap = {}; days.forEach(d=>dayMap[d]=[]);
        selectedItems.forEach(item=>{ if(item.hari&&dayMap[item.hari]) dayMap[item.hari].push(item); });
        days.forEach(d=>{ dayMap[d].sort((a,b)=>{ const t1=parseTime(a.jam), t2=parseTime(b.jam); return(t1?t1.start:0)-(t2?t2.start:0); }); });
        let totalSKS=selectedItems.reduce((s,i)=>s+parseInt(i.sks||0),0);
        document.getElementById('footer-sks').textContent=totalSKS;
        document.getElementById('footer-info').textContent=selectedItems.length+' mata kuliah';
        days.forEach(day=>{
            const cell=document.getElementById(day.toLowerCase());
            const items=dayMap[day]||[];
            if(items.length===0) cell.innerHTML='<span style="color:#a0aec0;font-size:13px;">— Tidak ada kelas —</span>';
            else { let html=''; items.forEach(item=>{
                const katClass=item.kategori && item.kategori.toLowerCase()==='pilihan'?'pilihan':'wajib';
                const katLabel=item.kategori||'Wajib';
                html+=`<div class="mk-item"><div><span class="kode">${item.kode} (${item.kelas})</span> <span class="nama-mk">${item.nama}</span> <span class="kategori-mk ${katClass}">${katLabel}</span></div><div><span class="ruang">${item.jam} | ${item.ruang}</span></div><div class="dosen-mk">${item.dosen||'-'}</div></div>`;
            }); cell.innerHTML=html; }
        });
        document.getElementById('jadwal-subjudul').textContent='Semester 1 / 3 / 5 / 7 / 8 | Total SKS: '+totalSKS+' | '+selectedItems.length+' mata kuliah';
    }

    function showToast(msg){ const toast=document.getElementById('toast'); toast.textContent=msg; toast.style.display='block'; clearTimeout(toast._timeout); toast._timeout=setTimeout(()=>{ toast.style.display='none'; },3000); }

    // ============================================
    // DETECT SHARE ID FROM PATH & LOAD
    // ============================================
    (function checkSchedulePath() {
        const path = window.location.pathname;
        if (path.startsWith('/schedule/')) {
            const shareId = path.replace('/schedule/', '');
            if (shareId && shareId.length > 0) {
                setTimeout(() => loadFromShareId(shareId), 500);
            }
        }
    })();
</script>
</body>
</html>
